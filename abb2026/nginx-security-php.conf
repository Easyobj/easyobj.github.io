# Include inside the PHP location. Requires nginx-security-http.conf in http {}.
client_max_body_size 16k;
client_body_timeout 10s;
limit_req zone=abb2026_php_ip burst=100 nodelay;
limit_req zone=abb2026_post_ip burst=30 nodelay;
limit_req_status 429;
limit_conn abb2026_connections 50;
limit_conn_status 429;
# FastCGI must receive Nginx's validated remote address, not a client header.
# In fastcgi_params this is normally already set to $remote_addr.
