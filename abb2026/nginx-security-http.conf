# Include ONCE inside nginx's http {} block, not inside server {}.
# Generous shared-NAT ceilings; tune after measuring the exhibition traffic.
map $request_method $abb2026_post_ip {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=abb2026_php_ip:10m rate=30r/s;
limit_req_zone $abb2026_post_ip zone=abb2026_post_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=abb2026_connections:10m;
