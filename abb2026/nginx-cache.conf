index index.php index.html;

location ~* ^/(?:Application|ThinkPHP|templates)(?:/|$) {
    deny all;
}

location ~* ^/api/(?:database/|bin/|config[^/]*|bootstrap\.php$) {
    deny all;
}

location ~* \.(woff2|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location = /index.html {
    return 302 /index.php$is_args$args;
}

# PHP retains the application's Cache-Control: no-store header.
# Include in a full HTTPS/PHP-FPM site, not a standalone server.
# Also include nginx-security-http.conf in http {}, and nginx-security-php.conf
# inside the existing PHP location. See SERVER_DEPLOYMENT.md for proxy trust.
