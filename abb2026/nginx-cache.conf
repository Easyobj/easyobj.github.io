index index.php index.html;

location ~* /templates/ {
    deny all;
}

location ~* \.(woff2|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location = /index.html {
    add_header Cache-Control "no-cache";
}
location = /index.php {
    add_header Cache-Control "no-cache";
}
